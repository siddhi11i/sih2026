version: '3.8'

services:
  bis-recommender:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bis_standards_recommender
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENABLE_BHASHINI=false
      - LOCAL_MODEL_ONLY=true
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
